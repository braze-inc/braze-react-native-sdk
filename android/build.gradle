apply plugin: 'com.android.library'
// Android Gradle Plugin 9 ships built-in Kotlin support and applies the Kotlin
// plugin itself. Applying it a second time fails the configuration phase with
// "Cannot add extension with name 'kotlin'". Apply it only when AGP is not
// providing Kotlin: AGP 8 and older, or AGP 9 with android.builtInKotlin=false.
def shouldApplyKotlinPlugin() {
  def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpMajor <= 8) {
    return true
  }
  // AGP 10 removes the opt-out: built-in Kotlin is always active there.
  if (agpMajor >= 10) {
    return false
  }
  def propertyVal = providers.gradleProperty("android.builtInKotlin").orNull
  def builtInKotlinEnabled = propertyVal != null ? propertyVal.toBoolean() : true
  return !builtInKotlinEnabled
}

if (shouldApplyKotlinPlugin()) {
  apply plugin: 'kotlin-android'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
  apply plugin: 'com.facebook.react'
}

def shouldImportBrazeLocationLibrary() {
  return project.hasProperty("importBrazeLocationLibrary") && project.importBrazeLocationLibrary == "true"
}

android {
  compileSdk safeExtGet('compileSdkVersion', 36)
  def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
  if (agpVersion.tokenize('.')[0].toInteger() >= 7) {
    namespace "com.braze.reactbridge"
    buildFeatures {
      buildConfig true
    }
  }

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 21)
    targetSdkVersion safeExtGet('targetSdkVersion', 36)
    buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
    versionCode 1
    versionName '1.0'
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        if (shouldApplyKotlinPlugin()) {
          java.srcDirs += ['src/newarch']
        } else {
          // Built-in Kotlin does not compile .kt files added via java.srcDirs.
          kotlin.srcDirs += ['src/newarch']
        }
        res.srcDirs += ['src/newarch/res']
      } else {
        if (shouldApplyKotlinPlugin()) {
          java.srcDirs += ['src/oldarch']
        } else {
          kotlin.srcDirs += ['src/oldarch']
        }
        res.srcDirs += ['src/oldarch/res']
      }
    }
  }

  // android.kotlinOptions is only available when kotlin-android is applied.
  if (shouldApplyKotlinPlugin()) {
    kotlinOptions {
      freeCompilerArgs = ['-Xjvm-default=all']
    }
  }

}

// AGP 9+ built-in Kotlin replaces android.kotlinOptions with this DSL.
if (!shouldApplyKotlinPlugin()) {
  kotlin {
    compilerOptions {
      freeCompilerArgs.add('-Xjvm-default=all')
    }
  }
}

dependencies {
  api 'com.facebook.react:react-native:+'

  def wrapper_braze_sdk_version = "44.0.0"
  api "com.braze:android-sdk-ui:${wrapper_braze_sdk_version}"

  if (shouldImportBrazeLocationLibrary()) {
    api "com.braze:android-sdk-location:${wrapper_braze_sdk_version}"
  }
}

